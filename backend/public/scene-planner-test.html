<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LongShot AI Scene Planner</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #101114;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      color: #ffb347;
    }

    textarea,
    input,
    select,
    button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 10px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #1b1d22;
      color: #fff;
      font-size: 15px;
    }

    textarea {
      min-height: 360px;
      resize: vertical;
    }

    button {
      background: #ff8c00;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #08090b;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      overflow-x: auto;
    }

    label {
      display: block;
      margin-top: 14px;
      color: #ccc;
    }

    .info {
      color: #8ee28e;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎬 LongShot AI Scene Planner</h1>

    <div class="info" id="info">
      Director Blueprint load ho raha hai...
    </div>

    <label>Director Blueprint JSON</label>

    <textarea
      id="blueprint"
      placeholder="Paste the complete Director Blueprint JSON here"
    ></textarea>

    <label>Duration in seconds</label>

    <input id="duration" type="number" value="30" min="1" />

    <label>Aspect Ratio</label>

    <select id="aspectRatio">
      <option value="9:16">9:16</option>
      <option value="16:9">16:9</option>
      <option value="1:1">1:1</option>
    </select>

    <button id="generateButton">
      Generate Scene Plan
    </button>

    <button id="videoJobsButton" disabled>
      Generate Video Jobs
    </button>

    <button id="providerTestButton" disabled>
      Run Provider Test
    </button>

    <pre id="result">Scene plan output will appear here...</pre>
  </div>

  <script>
    const blueprintInput = document.getElementById("blueprint");
    const durationInput = document.getElementById("duration");
    const aspectRatioInput = document.getElementById("aspectRatio");
    const generateButton = document.getElementById("generateButton");
    const videoJobsButton = document.getElementById("videoJobsButton");
    const providerTestButton = document.getElementById("providerTestButton");
    const result = document.getElementById("result");
    const info = document.getElementById("info");

    let latestScenePlan = null;
    let latestDirectorBlueprint = null;
    let latestVideoJobs = null;

    const savedBlueprint = sessionStorage.getItem(
      "longshot_director_blueprint"
    );

    const savedDuration = sessionStorage.getItem(
      "longshot_duration"
    );

    const savedAspectRatio = sessionStorage.getItem(
      "longshot_aspect_ratio"
    );

    if (savedBlueprint) {
      blueprintInput.value = savedBlueprint;
      info.textContent =
        "✅ Director Blueprint automatically loaded.";
    } else {
      info.textContent =
        "ℹ️ Blueprint manually paste kar sakte ho.";
    }

    if (savedDuration) {
      durationInput.value = savedDuration;
    }

    if (savedAspectRatio) {
      aspectRatioInput.value = savedAspectRatio;
    }

    generateButton.addEventListener("click", async () => {
      const blueprintText = blueprintInput.value.trim();
      const duration = Number(durationInput.value) || 30;
      const aspectRatio = aspectRatioInput.value;

      if (!blueprintText) {
        result.textContent =
          "Please paste or load the Director Blueprint JSON first.";
        return;
      }

      try {
        latestDirectorBlueprint = JSON.parse(blueprintText);
      } catch {
        result.textContent =
          "Invalid JSON. Paste only the complete blueprint JSON.";
        return;
      }

      generateButton.disabled = true;
      videoJobsButton.disabled = true;
      providerTestButton.disabled = true;
      result.textContent = "Scene Planner is working...";

      try {
        const response = await fetch("/api/scene-planner", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            directorBlueprint: latestDirectorBlueprint,
            duration,
            aspectRatio
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Scene Planner request failed."
          );
        }

        latestScenePlan = data.scenePlan;

        result.textContent = JSON.stringify(data, null, 2);

        videoJobsButton.disabled = false;
        info.textContent =
          "✅ Scene Plan successfully generated.";
      } catch (error) {
        result.textContent = "Error: " + error.message;
        info.textContent = "❌ Scene Planner failed.";
      } finally {
        generateButton.disabled = false;
        generateButton.textContent = "Generate Scene Plan";
      }
    });

    videoJobsButton.addEventListener("click", async () => {
      if (!latestScenePlan || !latestDirectorBlueprint) {
        result.textContent = "Generate the Scene Plan first.";
        return;
      }

      videoJobsButton.disabled = true;
      providerTestButton.disabled = true;
      videoJobsButton.textContent = "Creating Video Jobs...";
      result.textContent =
        "Video Generation jobs create ho rahe hain...";

      try {
        const response = await fetch("/api/video-jobs", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            scenePlan: latestScenePlan,
            directorBlueprint: latestDirectorBlueprint,
            provider: "provider-neutral"
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Video Jobs request failed."
          );
        }

        latestVideoJobs = data.videoJobs;

        result.textContent = JSON.stringify(data, null, 2);

        videoJobsButton.textContent = "Video Jobs Created";
        providerTestButton.disabled = false;

        info.textContent =
          "✅ Video Jobs created. Provider test ready.";
      } catch (error) {
        result.textContent = "Error: " + error.message;
        videoJobsButton.disabled = false;
        videoJobsButton.textContent = "Generate Video Jobs";
      }
    });

    providerTestButton.addEventListener("click", async () => {
      const jobs =
        latestVideoJobs?.jobs ||
        latestVideoJobs?.video_jobs ||
        [];

      if (!jobs.length) {
        result.textContent =
          "No video job found for provider testing.";
        return;
      }

      providerTestButton.disabled = true;
      providerTestButton.textContent = "Testing Provider...";
      result.textContent =
        "Mock Provider test chal raha hai...";

      try {
        const response = await fetch("/api/generate-video", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            job: jobs[0],
            provider: "mock"
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Provider test failed."
          );
        }

        result.textContent = JSON.stringify(data, null, 2);
        info.textContent =
          "✅ Provider Adapter successfully connected.";
        providerTestButton.textContent = "Provider Test Passed";
      } catch (error) {
        result.textContent = "Error: " + error.message;
        providerTestButton.disabled = false;
        providerTestButton.textContent = "Run Provider Test";
      }
    });
  </script>
</body>
</html>
