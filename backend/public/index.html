<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LongShot AI Research Test</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0b0b12;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    textarea {
      width: 100%;
      height: 140px;
      box-sizing: border-box;
      padding: 15px;
      background: #171720;
      color: white;
      border: 1px solid #333;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      color: #aaa;
    }

    pre {
      margin-top: 20px;
      padding: 15px;
      background: #111118;
      border-radius: 10px;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>LongShot AI</h1>

  <p>Research Engine Test</p>

  <textarea id="prompt"
    placeholder="Enter your video idea..."></textarea>

  <button onclick="runResearch()">
    Research Topic
  </button>

  <div id="status">Ready.</div>

  <pre id="result"></pre>

</div>

<script>

async function runResearch() {

  const prompt =
    document.getElementById("prompt").value;

  if (!prompt.trim()) {
    document.getElementById("status").innerText =
      "Please enter a topic.";
    return;
  }

  document.getElementById("status").innerText =
    "Researching...";

  document.getElementById("result").innerText = "";

  try {

    const response = await fetch("/api/research", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        prompt
      })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Research failed.");
    }

    document.getElementById("status").innerText =
      "Research completed.";

    document.getElementById("result").innerText =
      JSON.stringify(data.research, null, 2);

  } catch (error) {

    document.getElementById("status").innerText =
      "Research failed.";

    document.getElementById("result").innerText =
      error.message;

  }

}

</script>

</body>
</html>
